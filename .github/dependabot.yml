version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "area:ci-cd"
      - "dependencies"

  - package-ecosystem: "pip"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
    labels:
      - "area:api"
      - "dependencies"

  - package-ecosystem: "pip"
    directory: "/apps/agent"
    schedule:
      interval: "weekly"
    labels:
      - "area:agent"
      - "dependencies"

  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    labels:
      - "area:web"
      - "dependencies"
