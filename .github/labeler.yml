area:api:
  - changed-files:
      - any-glob-to-any-file: ['apps/api/**']

area:agent:
  - changed-files:
      - any-glob-to-any-file: ['apps/agent/**']

area:web:
  - changed-files:
      - any-glob-to-any-file: ['apps/web/**']

area:documentation:
  - changed-files:
      - any-glob-to-any-file: ['*.md', 'docs/**', 'apps/**/README.md']

area:ci-cd:
  - changed-files:
      - any-glob-to-any-file: ['.github/**']

area:environment:
  - changed-files:
      - any-glob-to-any-file: ['flake.*', '.env*', '.gitignore']
