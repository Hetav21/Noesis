name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      agent: ${{ steps.filter.outputs.agent }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before || '' }}
          filters: |
            api:
              - 'apps/api/**'
              - '.github/workflows/ci.yml'
              - 'flake.*'
            agent:
              - 'apps/agent/**'
              - '.github/workflows/ci.yml'
              - 'flake.*'
            web:
              - 'apps/web/**'
              - '.github/workflows/ci.yml'
              - 'flake.*'

  api:
    name: REST API (Python & Pytest)
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: noesis_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"

      - name: Install Python interpreter
        run: uv python install

      - name: Sync dependencies
        run: uv sync --frozen || uv sync

      - name: Lint and format check (Ruff)
        run: uvx ruff check . --output-format=github
        continue-on-error: true

      - name: Run test suite
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/noesis_test
          TESTING: "true"
          SESSION_SECRET: "test-session-secret-key-32-bytes-long-for-hmac"
        run: PYTHONPATH=. uv run --with pytest --with pytest-asyncio --with httpx pytest -v

  agent:
    name: Agent Engine (Python & Pytest)
    needs: detect-changes
    if: needs.detect-changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/agent

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: noesis_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "apps/agent/uv.lock"

      - name: Install Python interpreter
        run: uv python install

      - name: Sync dependencies
        run: uv sync --frozen || uv sync

      - name: Lint and format check (Ruff)
        run: uvx ruff check . --output-format=github
        continue-on-error: true

      - name: Run test suite
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/noesis_test
          TESTING: "true"
          OPENAI_API_KEY: "test-mock-key"
          AGENT_INTERNAL_SECRET: "test-agent-internal-secret-32-bytes"
        run: PYTHONPATH=. uv run --with pytest --with pytest-asyncio --with httpx pytest -v

  web:
    name: Web App (Bun & Build)
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Lint check
        run: bun run lint
        continue-on-error: true

      - name: Build production bundle
        run: bun run build

  ci:
    name: CI
    needs: [detect-changes, api, agent, web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate status
        run: |
          if [ "${{ needs.detect-changes.result }}" != "success" ] || [ "${{ needs.api.result }}" = "failure" ] || [ "${{ needs.agent.result }}" = "failure" ] || [ "${{ needs.web.result }}" = "failure" ]; then
            echo "CI checks failed."
            exit 1
          fi
          echo "CI checks succeeded or cleanly skipped."
