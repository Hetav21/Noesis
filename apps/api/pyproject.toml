[project]
name = "noesis-api"
version = "0.2.0"
description = "Noesis REST API service for Vercel Serverless"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.162.2",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "openai>=1.65.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "sqlmodel>=0.0.48",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
